<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12151e"><title>酒局積分 V5</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#f6f7fb;background:#12151e}*{box-sizing:border-box}body{margin:0;padding:20px 14px 65px;max-width:740px;margin-inline:auto}h1{font-size:26px;margin:4px 0}h2{font-size:18px;margin:0 0 12px}.sub{color:#a9b0c0;font-size:13px}.panel{background:#1d2230;border:1px solid #353c4b;border-radius:17px;padding:17px;margin-top:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.rank{display:flex;justify-content:space-between;border-bottom:1px solid #353c4b;padding:12px 3px}.rank:last-child{border:0}.score{font-size:22px;font-weight:700;color:#b1e6c4}.person{display:grid;grid-template-columns:1fr 1fr 70px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #353c4b}.person:last-child{border:0}.person strong{font-size:14px}select,input,button{font:inherit;border-radius:10px;padding:10px 8px;min-width:0}select,input{width:100%;color:#fff;background:#12151e;border:1px solid #4b5567}input{font-size:16px}button{border:0;background:#46506a;color:white;cursor:pointer}button.primary{background:#3caa76;color:#081a12;font-weight:700}button.danger{background:#6b3840}button:disabled{opacity:.45}button:active{transform:scale(.98)}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.buttons button{flex:1}.small{font-size:12px;color:#a9b0c0}.history{padding:10px 0;border-bottom:1px solid #353c4b;font-size:14px}.history:last-child{border:0}.scroll{max-height:280px;overflow:auto}#file{display:none}label.file{display:inline-block;padding:10px;border-radius:10px;background:#46506a;cursor:pointer}.status{font-size:13px;color:#b1e6c4;margin-top:10px}@media(max-width:400px){.person{grid-template-columns:78px 1fr 62px}.person strong{font-size:13px}select{font-size:13px}}</style></head><body><div class="top"><div><h1>🍻 酒局積分</h1><div class="sub">V5.0 · 純積分制 · 喝水不扣分</div></div><div class="sub" id="round"></div></div><section class="panel"><h2>🏆 總排行榜</h2><div id="board"></div><div class="small" id="total"></div></section><section class="panel"><h2>本輪記分</h2><div class="small">每位玩家可選不同飲品；同一杯不可拆分重複計分</div><div id="entry"></div><div class="buttons"><input id="newname" placeholder="新玩家名字" aria-label="新玩家名字"><input id="newscore" type="number" min="0" step="1" value="0" aria-label="起始積分" style="max-width:90px"><button id="addplayer">＋新增玩家</button></div><div class="buttons"><button id="water">全員不喝</button><button class="primary" id="commit">確認本輪並進下一輪</button></div><div id="status" class="status"></div></section><section class="panel"><h2>📋 記錄</h2><div class="buttons"><button id="undo">撤銷上一輪</button><button id="copy">複製排行榜</button></div><div class="scroll" id="history"></div></section><section class="panel"><h2>💾 備份與還原</h2><p class="small">積分會儲存在這台手機的瀏覽器；換手機、清除 Safari 網站資料可能遺失。建議每次結束匯出 JSON 備份。</p><div class="buttons"><button id="export">匯出 JSON</button><label class="file" for="file">匯入 JSON</label><input id="file" type="file" accept=".json,application/json"></div><div class="buttons"><button class="danger" id="reset">重設到第 37 輪五人積分</button></div></section><section class="panel"><h2>📖 飲品計分</h2><div class="small">啤酒 350ml +1 · Highball 250ml +1 · 香檳 120ml +2 · 紅／白酒 120ml +2 · 清酒半合 90ml +2 · 清酒一合 180ml +4 · Shot 30ml +2 · 水／不喝 0</div></section><script>
const drinks=[["不喝／水",0],["啤酒 350ml",1],["Highball 250ml",1],["香檳 120ml",2],["紅／白酒 120ml",2],["清酒半合 90ml",2],["清酒一合 180ml",4],["Shot 30ml",2]];
const key="drinking_score_v5_20261018",baseNames=["Carina","Tinky","Taylor","Johnny","ゆうだい"];
const baseline=()=>({version:5,round:37,scores:{Carina:25,Tinky:37,Taylor:37,Johnny:33,"ゆうだい":10},history:[]});
const $=id=>document.getElementById(id);
let state;try{state=JSON.parse(localStorage.getItem(key))||baseline()}catch{state=baseline()}
function valid(s){return !!(s&&Number.isInteger(s.round)&&s.round>=7&&s.scores&&typeof s.scores==="object"&&!Array.isArray(s.scores)&&Object.keys(s.scores).length&&Object.values(s.scores).every(v=>Number.isFinite(v)&&v>=0)&&Array.isArray(s.history))}
if(!valid(state))state=baseline();
function migrate(s){if(!Object.prototype.hasOwnProperty.call(s.scores,"ゆうだい"))s.scores["ゆうだい"]=10;return s}
state=migrate(state);
function names(){return Object.keys(state.scores)}
function save(){localStorage.setItem(key,JSON.stringify(state))}
function notice(s){$("status").textContent=s}
function initEntry(){const el=$("entry");el.replaceChildren();for(const n of names()){const row=document.createElement("div");row.className="person";const name=document.createElement("strong");name.textContent=n;const sel=document.createElement("select");sel.id="d_"+n;drinks.forEach(([label,points],i)=>{const op=document.createElement("option");op.value=i;op.textContent=label+" (+"+points+")";sel.append(op)});const qty=document.createElement("input");qty.type="number";qty.min="0";qty.max="99";qty.step="1";qty.value="0";qty.id="q_"+n;qty.setAttribute("aria-label",n+" 杯數");row.append(name,sel,qty);el.append(row)}}
function render(){const board=Object.entries(state.scores).sort((a,b)=>b[1]-a[1]);$("round").textContent="第 "+state.round+" 輪";const b=$("board");b.replaceChildren();board.forEach(([n,v],i)=>{const row=document.createElement("div");row.className="rank";const name=document.createElement("span");name.textContent=(i+1)+". "+n;const score=document.createElement("span");score.className="score";score.textContent=v+" 分";row.append(name,score);b.append(row)});$("total").textContent="合計 "+Object.values(state.scores).reduce((a,b)=>a+b,0)+" 分";const h=$("history");h.replaceChildren();if(state.history.length){state.history.slice().reverse().forEach(item=>{const row=document.createElement("div");row.className="history";row.textContent="第 "+item.round+" 輪 · "+names().map(n=>n+" +"+(item.add?.[n]||0)).join(" ／ ");h.append(row)})}else{const p=document.createElement("p");p.className="small";p.textContent="尚無新增輪次紀錄";h.append(p)}$("undo").disabled=!state.history.length}
function commit(){const add={},detail={};for(const n of names()){const q=Number($("q_"+n).value),idx=Number($("d_"+n).value);if(!Number.isInteger(q)||q<0||q>99||!drinks[idx]){notice("請檢查 "+n+" 的杯數");return}add[n]=q*drinks[idx][1];detail[n]={drink:drinks[idx][0],qty:q,points:add[n]}}state.history.push({round:state.round,add,detail});for(const n of names())state.scores[n]+=add[n];state.round++;save();initEntry();render();notice("已儲存，進入第 "+state.round+" 輪")}
function undo(){if(!state.history.length)return;const h=state.history.pop();for(const n of names())state.scores[n]-=h.add?.[n]||0;state.round=h.round;save();render();notice("已撤銷第 "+h.round+" 輪")}
function download(name,content){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([content],{type:"application/json"}));a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
$("commit").onclick=commit;$("undo").onclick=undo;
$("water").onclick=()=>{for(const n of names()){$("d_"+n).value=0;$("q_"+n).value=0}notice("已設定全員不喝，按確認記錄本輪")};
$("addplayer").onclick=()=>{const n=$("newname").value.trim(),score=Number($("newscore").value);if(!n){notice("請輸入玩家名字");return}if(Object.prototype.hasOwnProperty.call(state.scores,n)){notice("玩家已存在");return}if(!Number.isInteger(score)||score<0){notice("起始積分需為 0 以上整數");return}state.scores[n]=score;save();initEntry();render();$("newname").value="";$("newscore").value="0";notice("已新增 "+n+"（"+score+" 分），可在上方記分")};
$("export").onclick=()=>download("drinking-score-round-"+state.round+".json",JSON.stringify(state,null,2));
$("file").onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data&&Array.isArray(data.players)&&!data.scores){data.scores=Object.fromEntries(data.players.map(p=>[p.name,p.score]))}if(!valid(data))throw Error("格式不正確");if(!confirm("匯入會覆蓋目前分數，確定嗎？"))return;state=migrate(data);save();initEntry();render();notice("備份匯入成功")}catch(err){alert("無法匯入："+err.message)}e.target.value=""};
$("reset").onclick=()=>{if(confirm("確定要清除現有分數和紀錄，恢復第 37 輪五人積分？")){state=baseline();save();initEntry();render();notice("已恢復起始積分")}};
$("copy").onclick=async()=>{const s="第 "+state.round+" 輪\n"+Object.entries(state.scores).sort((a,b)=>b[1]-a[1]).map(([n,v])=>n+"："+v+" 分").join("\n");try{await navigator.clipboard.writeText(s);notice("已複製排行榜")}catch{prompt("請複製排行榜",s)}};
save();initEntry();render();
</script></body></html>
